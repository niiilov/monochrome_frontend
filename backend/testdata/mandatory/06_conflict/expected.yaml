id: T6
title: Противоречивые сообщения
control_time: "2026-11-07T12:00:00+03:00"
dataset:
  - input.json
events: 1
recipients: []
journal:
  - id: t6-co
    status: включён
    group: "E01"
    reason_code: selected
    reason_contains: "Событие вошло в выпуск"
